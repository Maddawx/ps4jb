<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Loading</title>
    <style>
      :root {
        --txt: #dbe7fb;
        --muted: #9fb4d4;
        --faint: #6d84a8;
        --cx: #7cc4ff;
        --cc: #ff6b81;
        --cs: #e07bd0;
        --ct: #57e0b0;
        --ok: #7fe0a8;
        --warn: #ffcf6b;
        --bad: #ff6b81;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: calc(28px + env(safe-area-inset-top, 0px)) 20px
          calc(28px + env(safe-area-inset-bottom, 0px));
        color: var(--txt);
        font:
          15px/1.5 "Segoe UI",
          system-ui,
          sans-serif;
        background:
          radial-gradient(
            130% 90% at 50% -18%,
            #3f78cc 0%,
            #1e447e 38%,
            #0b264d 72%,
            #061530 100%
          );
        background-attachment: fixed;
      }

      /* ---- PlayStation glyphs, spinning in turns ---- */
      #glyphs {
        display: flex;
        gap: 24px;
        align-items: center;
        justify-content: center;
      }
      .g {
        width: 46px;
        height: 46px;
        opacity: 0.28;
        transform: scale(0.9);
        animation: relay 2s ease-in-out infinite;
      }
      .g path,
      .g circle,
      .g rect {
        fill: none;
        stroke: var(--c);
        stroke-width: 3.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .gx {
        --c: var(--cx);
        animation-delay: 0s;
      }
      .gc {
        --c: var(--cc);
        animation-delay: 0.5s;
      }
      .gs {
        --c: var(--cs);
        animation-delay: 1s;
      }
      .gt {
        --c: var(--ct);
        animation-delay: 1.5s;
      }
      @keyframes relay {
        0%,
        100% {
          opacity: 0.24;
          transform: scale(0.9) rotate(0);
          filter: drop-shadow(0 0 0 transparent);
        }
        7% {
          opacity: 1;
          transform: scale(1.16) rotate(0);
          filter: drop-shadow(0 0 12px var(--c));
        }
        18% {
          opacity: 1;
          transform: scale(1.16) rotate(360deg);
          filter: drop-shadow(0 0 12px var(--c));
        }
        26% {
          opacity: 0.24;
          transform: scale(0.9) rotate(360deg);
          filter: drop-shadow(0 0 0 transparent);
        }
      }

      /* ---- status + timer ---- */
      #status {
        font-size: 17px;
        font-weight: 300;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #cfe0f7;
        text-indent: 0.32em;
      }
      #timer {
        text-align: center;
      }
      #timer .tlabel {
        display: block;
        font:
          10px/1 Consolas,
          ui-monospace,
          monospace;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 8px;
      }
      #elapsed {
        font:
          200 46px/1 Consolas,
          ui-monospace,
          monospace;
        letter-spacing: 0.02em;
        color: #eaf2ff;
      }

      /* ---- log window (#wrap keeps jb.js's {#state,#out} untouched) ---- */
      #wrap {
        width: 100%;
        max-width: 560px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        background: rgba(4, 14, 30, 0.5);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        box-shadow:
          0 18px 50px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        overflow: hidden;
      }
      @supports not (
        (backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))
      ) {
        #wrap {
          background: #071528;
        }
      }
      #state {
        padding: 10px 14px;
        font:
          11px/1 Consolas,
          ui-monospace,
          monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.03);
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }
      #out {
        height: 220px;
        max-height: 40vh;
        overflow-y: auto;
        padding: 10px 14px;
        white-space: pre-wrap;
        word-break: break-word;
        font:
          12px/1.6 Consolas,
          ui-monospace,
          monospace;
        color: #b7c6de;
      }
      #out .line {
        padding: 1px 0;
      }
      #out::-webkit-scrollbar {
        width: 9px;
      }
      #out::-webkit-scrollbar-thumb {
        border: 2px solid transparent;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.14);
        background-clip: content-box;
      }
      .ok,
      .safe {
        color: var(--ok);
      }
      .warn {
        color: var(--warn);
      }
      .bad,
      .danger {
        color: var(--bad);
      }
      code {
        color: #9fb3d0;
      }

      #msg {
        display: none;
        font:
          13px/1.4 Consolas,
          ui-monospace,
          monospace;
        color: var(--bad);
      }

      /* ---- done / fail states from jb.js body classes ---- */
      body.done .g,
      body.fail .g {
        animation: none;
        opacity: 1;
        transform: scale(1);
      }
      body.done .g path,
      body.done .g circle,
      body.done .g rect {
        stroke: var(--ok);
        filter: drop-shadow(0 0 8px rgba(127, 224, 168, 0.55));
      }
      body.fail .g path,
      body.fail .g circle,
      body.fail .g rect {
        stroke: var(--bad);
        filter: drop-shadow(0 0 8px rgba(255, 107, 129, 0.5));
      }
      body.done #status {
        color: var(--ok);
      }
      body.fail #status {
        color: var(--bad);
      }
      body.fail #msg {
        display: block;
      }

      @media (prefers-reduced-motion: reduce) {
        .g {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="glyphs" aria-hidden="true">
      <svg class="g gx" viewBox="0 0 40 40">
        <path d="M11 11 L29 29 M29 11 L11 29" />
      </svg>
      <svg class="g gc" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="10" />
      </svg>
      <svg class="g gs" viewBox="0 0 40 40">
        <rect x="11" y="11" width="18" height="18" rx="1.5" />
      </svg>
      <svg class="g gt" viewBox="0 0 40 40">
        <path d="M20 9 L30.4 29 L9.6 29 Z" />
      </svg>
    </div>

    <div id="status">Working</div>

    <div id="timer">
      <span class="tlabel">Elapsed</span>
      <span id="elapsed">0:00.00</span>
    </div>

    <section id="wrap">
      <div id="state">Log</div>
      <div id="out"></div>
    </section>

    <div id="msg">Restart your console</div>

    <script type="module">
      import "./jb.js?v=10";
    </script>

    <!-- UI shell: timer, log capture, error handling. Reads jb.js state, never edits jb.js. -->
    <script>
      (function () {
        var body = document.body;
        var out = document.getElementById("out");
        var elapsed = document.getElementById("elapsed");
        var statusEl = document.getElementById("status");

        var now =
          window.performance && performance.now
            ? function () {
                return performance.now();
              }
            : function () {
                return Date.now();
              };
        var start = now();
        var frozen = null;
        var atBottom = true;

        function pad2(n) {
          n = String(n);
          return n.length < 2 ? "0" + n : n;
        }
        function fmt(ms) {
          if (ms < 0) ms = 0;
          var s = ms / 1000,
            m = Math.floor(s / 60),
            r = s - m * 60,
            ss = Math.floor(r),
            cs = Math.floor((r - ss) * 100);
          return m + ":" + pad2(ss) + "." + pad2(cs);
        }
        function elapsedNow() {
          return frozen != null ? frozen : now() - start;
        }

        function tick() {
          try {
            elapsed.textContent = fmt(elapsedNow());
          } catch (e) {}
          if (frozen == null) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);

        function safe(o) {
          try {
            return typeof o === "string" ? o : JSON.stringify(o);
          } catch (e) {
            return String(o);
          }
        }
        function logLine(msg, cls) {
          try {
            if (!out) return;
            var d = document.createElement("div");
            d.className = "line" + (cls ? " " + cls : "");
            d.textContent =
              "[" + (elapsedNow() / 1000).toFixed(2) + "s] " + msg;
            out.appendChild(d);
            if (atBottom) out.scrollTop = out.scrollHeight;
          } catch (e) {}
        }

        if (out) {
          out.addEventListener("scroll", function () {
            atBottom = out.scrollTop + out.clientHeight >= out.scrollHeight - 8;
          });
        }

        // mirror console output into the log window
        ["log", "info", "warn", "error"].forEach(function (k) {
          var orig = console[k] ? console[k].bind(console) : function () {};
          console[k] = function () {
            try {
              var parts = [];
              for (var i = 0; i < arguments.length; i++)
                parts.push(safe(arguments[i]));
              logLine(
                parts.join(" "),
                k === "error" ? "bad" : k === "warn" ? "warn" : "ok"
              );
            } catch (e) {}
            return orig.apply(console, arguments);
          };
        });

        // catch anything thrown, including from jb.js
        window.addEventListener("error", function (e) {
          var where = e && e.filename
            ? " (" +
              e.filename.split("/").pop() +
              (e.lineno ? ":" + e.lineno : "") +
              ")"
            : "";
          logLine("Error: " + ((e && e.message) || "unknown") + where, "bad");
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          logLine(
            "Unhandled rejection: " + (r && r.message ? r.message : safe(r)),
            "bad"
          );
        });

        function setStatus(t) {
          try {
            if (statusEl) statusEl.textContent = t;
          } catch (e) {}
        }
        function onState() {
          if (body.classList.contains("done")) {
            if (frozen == null) {
              frozen = now() - start;
              setStatus("Complete");
              logLine("Complete in " + fmt(frozen), "ok");
            }
          } else if (body.classList.contains("fail")) {
            if (frozen == null) {
              frozen = now() - start;
              setStatus("Failed");
              logLine("Failed after " + fmt(frozen), "bad");
            }
          }
        }
        new MutationObserver(onState).observe(body, {
          attributes: true,
          attributeFilter: ["class"],
        });

        logLine("Session started", "ok");
        onState();
      })();
    </script>
          <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
